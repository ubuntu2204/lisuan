<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  豆包 Windows 客户端（Wine 11）专用字体替换。

  背景：豆包界面 CSS 大量使用 font-family:PingFang SC / Microsoft YaHei，
  并带 font-weight:300。本机没有 PingFang SC，fontconfig 回退到
  Noto Sans CJK SC Light，笔画过细看不清。这里把苹果/微软的 Light 族名
  统一替换为有 Regular 字重的微软雅黑/等线，并把字重抬到 medium。

  只通过 FONTCONFIG_FILE 注入 doubao/run-doubao-wine11.sh 的进程树，
  不做全局替换，不影响 Steam / 其它 Electron 应用。
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- PingFang SC 是豆包 CSS 首选；本机缺失，默认回退 Noto Light -->
  <match target="pattern">
    <test name="family" compare="eq"><string>PingFang SC</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Microsoft YaHei</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>medium</const></edit>
  </match>

  <!-- 常见 Light 家族名：换到同名 Regular 家族，并抬字重 -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Microsoft YaHei UI Light</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Microsoft YaHei UI</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>medium</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Microsoft YaHei Light</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Microsoft YaHei</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>medium</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>微软雅黑 Light</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Microsoft YaHei</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>medium</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>DengXian Light</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DengXian</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>medium</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Segoe UI Light</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Segoe UI</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>medium</const></edit>
  </match>
</fontconfig>
