# Gitee Go 流水线：push 到 master/main 时跑测试并打包 deb，
# 以原样 .deb 文件发布到 Gitee Releases（Tag: deb-latest，自动覆盖更新）。
#
# 注意：这是 Gitee Go 原生 schema（非 GitHub Actions 风格）：
#   - stages 直接带 steps（无 jobs 层）；step 用 "插件@版本" 标识；
#   - 构建机为 CentOS 8 系官方镜像（内置阿里源），默认没有 dpkg-deb——
#     打包前需临时安装；ShellCheck/make/patch/perl 同理；
#   - deb 固定重命名为 lisuan-fix.deb（Release 附件路径是静态声明）；
#   - 产物经 artifacts 暂存 + release@gitee 直出附件（不经过制品库 tar.gz）。
name: lisuan-build-deb
displayName: 打包deb（测试+构建+发布）

triggers:
  push:
    branches:
      precise: [master, main]

stages:
  - stage: test-build
    displayName: 测试与打包
    strategy: fast
    trigger: auto
    steps:
      - step: build@python
        name: run_tests
        displayName: 运行测试套件
        pythonVersion: '3.9'
        commands:
          - yum install -y -q epel-release || true
          - yum install -y -q make patch perl git ShellCheck || dnf install -y -q make patch perl git ShellCheck || true
          - bash tests/run-tests.sh

      - step: build@python
        name: build_deb
        displayName: 构建 deb 包
        pythonVersion: '3.9'
        commands:
          - yum install -y -q epel-release || true
          - yum install -y -q dpkg || dnf install -y -q dpkg || true
          - VER=$(date +%Y.%m.%d)
          - bash packaging/build-deb.sh "$VER"
          - cp packaging/dist/lisuan-fix_*.deb lisuan-fix.deb
          - echo "---- 产物自检 ----"
          - dpkg-deb --info lisuan-fix.deb | head -8
          - sha256sum lisuan-fix.deb
        artifacts:
          - name: DEB_ARTIFACT
            path:
              - lisuan-fix.deb

  - stage: publish
    displayName: 发布
    strategy: fast
    trigger: auto
    steps:
      - step: release@gitee
        name: release_gitee
        displayName: 发布 deb 到 Gitee Releases
        releaseName: lisuan-fix（构建 ${GITEE_PIPELINE_BUILD_NUMBER}）
        description: 砺算 7G100 修复工具 deb 包（自动构建）。安装：sudo dpkg -i lisuan-fix.deb
        tagName: deb-latest
        upstreamArtifact:
          - DEB_ARTIFACT
        assertFiles:
          - lisuan-fix.deb
        prerelease: false
        allowUpdate: true
