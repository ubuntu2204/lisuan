# Gitee Go pipeline: run the offline test suite on every push / PR.
#
# The tests need no GPU, no root, no dkms — only bash, patch, make, perl.
# See README.md -> 自动化测试 for what each test unit covers.
#
# 注: triggers 与 on 双写——Gitee Go 原生识别 triggers，同时兼容 GitHub 风格。
name: lisuan-test-suite
displayName: "离线测试套件"

triggers:
  push:
    branches:
      include:
        - master
        - main
  pull_request:
    branches:
      include:
        - master
        - main

on:
  push:
    branches:
      - master
      - main
  pull_request:

stages:
  - name: test
    displayName: "测试"
    jobs:
      - name: run-tests
        displayName: "运行测试套件"
        steps:
          - name: checkout
            displayName: "检出代码"
            uses: actions/checkout@v1

          - name: run
            displayName: "运行测试"
            shell: bash
            run: |
              set -euo pipefail
              bash tests/run-tests.sh
